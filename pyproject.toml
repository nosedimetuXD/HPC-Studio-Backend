[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpc-studio"
version = "0.1.0"
description = "Native Scientific & Quantum Workbench for Linux HPC"
readme = "README.md"
authors = [
    { name = "HPC Studio Team" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "numpy>=2.2.6",
    "paramiko>=3.0.0",
    "pydantic>=2.0.0",
    "pyzmq>=27.2.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
hpc-studio = "hpc_studio.main:main"
hpc-studio-server = "hpc_studio.server.cli:main"
hpc-studio-mcp = "hpc_studio.mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hpc_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-o cache_dir=/tmp/.pytest_cache"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ipykernel>=7.3.0",
    "openpyxl>=3.1.5",
    "pytest-asyncio>=0.23.0",
]
